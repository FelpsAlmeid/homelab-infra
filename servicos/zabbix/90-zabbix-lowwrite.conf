# /etc/postgresql/17/main/conf.d/90-zabbix-lowwrite.conf
# Reduz escrita em disco para o banco do Zabbix.
synchronous_commit = off      # agrupa gravações; numa queda pode perder os últimos segundos (aceitável p/ monitoramento)
wal_compression = on          # WAL menor
checkpoint_timeout = 15min    # menos checkpoints
max_wal_size = 2GB            # evita checkpoints forçados
shared_buffers = 512MB        # mais cache em memória
effective_cache_size = 2GB    # ajuda o planejador de consultas
