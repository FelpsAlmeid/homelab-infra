services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '127.0.0.1:81:81'     # painel: só local (túnel SSH de reserva)
      - '10.0.213.1:81:81'    # painel: IP do túnel WireGuard (acesso pela VPN)
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
